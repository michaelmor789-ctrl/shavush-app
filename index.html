<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f4d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שבו״ש">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>שבו״ש · בעוז הרוח</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2419;--olive:#3f4d24;--olive2:#56692f;--khaki:#c8b98a;--sand:#efe9d8;--paper:#fbf8ef;--line:#ddd3b5;--red:#9b2d20;--muted:#6b6a5c}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,system-ui,Arial,sans-serif;background:var(--sand);color:var(--ink);line-height:1.55;font-size:15px;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#2c3619 0%,var(--olive) 60%,var(--olive2) 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;border-bottom:4px solid var(--khaki)}
.hwrap{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:84px;height:84px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.htitle{flex:1;min-width:200px}
.htitle h1{margin:0;font-size:1.6rem;font-weight:800}
.htitle p{margin:2px 0 0;color:var(--khaki);font-size:.92rem}
.mode{background:rgba(0,0,0,.25);border-radius:999px;padding:4px 12px;font-size:.85rem}
main{max-width:1040px;margin:0 auto;padding:22px 16px 40px}
section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(40,40,20,.05)}
h2{margin:0 0 14px;font-size:1.12rem;font-weight:800;color:var(--olive);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:18px;background:var(--khaki);border-radius:3px}
label{display:block;font-size:.85rem;margin-bottom:5px;color:#4a4a3e;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--olive2);box-shadow:0 0 0 3px rgba(86,105,47,.18)}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{margin-bottom:12px}
button{font:inherit;font-weight:600;background:var(--olive);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:hover{background:var(--olive2)}
button.ghost{background:transparent;color:var(--olive);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--red);border:1px solid #e4b8b0}
button:disabled{opacity:.5;cursor:default}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--olive);font-weight:600}
.chip.strong{background:var(--olive);color:#fff;border-color:var(--olive)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:220px}
.toolbar select{width:auto;min-width:170px}
.toggle{display:flex;gap:8px;align-items:center;margin:0;color:#333;font-weight:600;white-space:nowrap}
.toggle input{width:auto}
.card{border:1px solid var(--line);border-right:5px solid var(--olive2);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.card.unassigned{border-right-color:var(--red)}
.card h3{margin:0 0 8px;font-size:1.08rem;font-weight:800}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 18px;font-size:.92rem}
.meta b{color:var(--muted);font-weight:600}
.pill{display:inline-block;background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.85rem}
.pill.red{background:#fbe9e5;border-color:#e4b8b0;color:var(--red)}
.notes{white-space:pre-wrap;margin-top:10px;padding:8px 10px;background:var(--paper);border-radius:8px;color:#4a4a3e;font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.actions select{width:auto;min-width:180px}
.muted{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.banner{padding:11px 14px;border-radius:10px;background:#fbe9e5;color:var(--red);margin-bottom:14px;display:none}
.msg{font-size:.92rem;margin-top:10px;color:var(--olive);font-weight:600;min-height:1.2em}
.msg.bad{color:var(--red)}
.group{margin-top:16px}
.group h3{font-size:1rem;font-weight:800;color:var(--olive);border-bottom:2px solid var(--khaki);padding-bottom:6px;margin:0 0 12px;display:flex;justify-content:space-between}
.hidden{display:none!important}
.login{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.login input{width:auto;min-width:200px}
.brand-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.brand-tools input[type=file]{width:auto;padding:6px;font-size:.9rem}
a{color:var(--olive2);font-weight:600}
@media (max-width:600px){.htitle h1{font-size:1.3rem}.toolbar select{flex:1}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo" id="logoBox"><img src="logo.jpg" alt="לוגו בעוז הרוח"></div>
    <div class="htitle">
      <h1>שבו״ש · אחראים ושבושים</h1>
      <p>בעוז הרוח · מכינה קדם־צבאית, אשדוד</p>
    </div>
    <div class="mode" id="modeTag">מצב: אחראי</div>
  </div>
</header>

<main>
  <div id="err" class="banner"></div>

  <section>
    <h2>מי אני</h2>
    <div class="row">
      <div class="field">
        <label for="me">בחרו את התפקיד שלכם (נשמר בדפדפן)</label>
        <select id="me"></select>
      </div>
    </div>
    <div id="loginBox" class="login hidden">
      <input id="pw" type="password" placeholder="סיסמת צוות">
      <button id="loginBtn" type="button">כניסה לצוות</button>
      <span id="loginMsg" class="muted"></span>
    </div>
  </section>

  <section>
    <h2 id="addTitle">הוספת שבוש</h2>
    <form id="form">
      <div class="row">
        <div class="field"><label for="f-name">שם מלא *</label><input id="f-name" required></div>
        <div class="field"><label for="f-phone">טלפון *</label><input id="f-phone" type="tel" inputmode="tel" required></div>
        <div class="field"><label for="f-city">עיר / יישוב</label><input id="f-city"></div>
        <div class="field"><label for="f-arrival">תאריך הגעה לשבו״ש</label><input id="f-arrival" type="date"></div>
        <div class="field"><label for="f-resp">משויך לאחראי</label><select id="f-resp"></select></div>
      </div>
      <div class="field"><label for="f-notes">הערות</label><textarea id="f-notes"></textarea></div>
      <button id="add" type="submit">הוסף שבוש</button>
      <div id="fmsg" class="msg"></div>
    </form>
  </section>

  <section>
    <h2>שבושים</h2>
    <div id="stats" class="stats"></div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="חיפוש לפי שם, טלפון או עיר">
      <select id="filter"><option value="all">כל האחראים</option></select>
      <label class="toggle"><input id="group" type="checkbox"> הצג לפי אחראי</label>
    </div>
    <div id="list"></div>
    <p class="muted">הנתונים משותפים לכל מי שיש לו גישה לדף.</p>
  </section>
</main>

<script>
// ---- config (same Firebase Realtime DB as the mechina app) ----
const DB = 'https://shavush-app-default-rtdb.firebaseio.com';
const DB_READY = !!DB;
const STAFF_PASSWORD = ''; // TODO: סיסמת צוות לשבו״ש (לא לשתף את סיסמת אפליקציית הלוז)

const RESP = ["אליה לייק","נתנאל פאסי","עמיחי שינובר","עמית לבקוביץ"];
const MGMT = "הנהלת המכינה";
const UNASSIGNED = "לא שויך";
const OWNERS = [...RESP, MGMT];
const ME_KEY = "bz-shavush-me", ADMIN_KEY = "bz-shavush-admin";
const $ = id => document.getElementById(id);

let rows = [], me = RESP[0], admin = false;

const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} }
};
function fillSelect(sel, values, selected){
  sel.innerHTML = "";
  values.forEach(v => {
    const o = document.createElement("option"); o.value = v; o.textContent = v;
    if (v === selected) o.selected = true;
    sel.appendChild(o);
  });
}
function showErr(m){ const b = $("err"); b.textContent = m; b.style.display = m ? "block" : "none"; }
function fmsg(m, bad){ const f = $("fmsg"); f.textContent = m; f.className = "msg" + (bad ? " bad" : ""); }
function assigned(r){ return OWNERS.includes(r.responsible) ? r.responsible : UNASSIGNED; }
function isMgmt(){ return me === MGMT; }
function defaultOwner(){ return isMgmt() ? MGMT : (me === MGMT ? RESP[0] : me); }
function toWa(phone){
  let d = (phone || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "972" + d.slice(1);
  return "https://wa.me/" + d;
}
function fmtDate(s){ if (!s) return ""; const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; }
function newId(){ return "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

// ---- REST calls to the Realtime Database ----
async function dbReq(path, method, body){
  if (!DB_READY) throw new Error('db not configured');
  const res = await fetch(`${DB}/${path}.json`, {
    method, headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error("db " + res.status);
  return res.status === 204 ? null : res.json();
}

// ---- identity & staff mode ----
const roleOpts = [...RESP, MGMT];
me = roleOpts.includes(ls.get(ME_KEY)) ? ls.get(ME_KEY) : RESP[0];
admin = ls.get(ADMIN_KEY) === "1";
fillSelect($("me"), roleOpts, me);
fillSelect($("f-resp"), OWNERS, defaultOwner());
[...OWNERS, UNASSIGNED].forEach(v => {
  const o = document.createElement("option"); o.value = v; o.textContent = v; $("filter").appendChild(o);
});

function applyRole(){
  const needLogin = false;
  $("loginBox").classList.toggle("hidden", !needLogin);
  $("modeTag").textContent = isMgmt() ? "מצב: הנהלת המכינה" : "מצב: אחראי";
  $("addTitle").textContent = isMgmt() ? "הוספת שבוש (הנהלה)" : "הוספת שבוש";
  $("f-resp").value = defaultOwner();
}
$("me").onchange = () => {
  me = $("me").value;
  ls.set(ME_KEY, me);
  applyRole(); render();
};
$("loginBtn").onclick = () => {
  if (STAFF_PASSWORD && $("pw").value === STAFF_PASSWORD) {
    admin = true; ls.set(ADMIN_KEY, "1"); $("pw").value = ""; $("loginMsg").textContent = "";
    applyRole(); render();
  } else { $("loginMsg").textContent = "סיסמה שגויה"; }
};
applyRole();

// ---- add ----
$("form").onsubmit = async e => {
  e.preventDefault();
  const name = $("f-name").value.trim();
  const phone = $("f-phone").value.trim();
  if (!name) return fmsg("נא למלא שם מלא", true);
  if (phone.replace(/\D/g, "").length < 9) return fmsg("נא להזין מספר טלפון תקין", true);
  const data = {
    name, phone,
    city: $("f-city").value.trim(),
    arrival: $("f-arrival").value,
    responsible: $("f-resp").value,
    notes: $("f-notes").value.trim(),
    addedBy: me,
    createdAt: new Date().toISOString()
  };
  $("add").disabled = true;
  try {
    await dbReq("shavushim/" + newId(), "PUT", data);
    e.target.reset();
    $("f-resp").value = defaultOwner();
    fmsg("נשמר ✓");
    load();
  } catch (err) {
    fmsg("השמירה נכשלה, נסו שוב", true);
  } finally {
    $("add").disabled = false;
  }
};

// ---- card actions ----
async function reassign(r, value){
  try { await dbReq("shavushim/" + r.id, "PATCH", { responsible: value }); load(); }
  catch(e){ showErr("שינוי האחראי נכשל, נסו שוב"); }
}
async function remove(r, btn){
  if (!btn.dataset.armed) { btn.dataset.armed = "1"; btn.textContent = "לחצו שוב לאישור"; return; }
  try { await dbReq("shavushim/" + r.id, "DELETE"); load(); }
  catch(e){ showErr("המחיקה נכשלה, נסו שוב"); }
}

function metaItem(parent, label, value){
  const d = document.createElement("div");
  const b = document.createElement("b"); b.textContent = label + ": ";
  d.appendChild(b);
  if (value instanceof Node) d.appendChild(value); else d.appendChild(document.createTextNode(value || "—"));
  parent.appendChild(d);
}

function card(r){
  const owner = assigned(r);
  const div = document.createElement("div");
  div.className = "card" + (owner === UNASSIGNED ? " unassigned" : "");

  const h = document.createElement("h3"); h.textContent = r.name || "ללא שם"; div.appendChild(h);

  const meta = document.createElement("div"); meta.className = "meta";
  const phoneWrap = document.createElement("span");
  phoneWrap.textContent = r.phone || "אין טלפון";
  if (r.phone) {
    const wa = document.createElement("a");
    wa.href = toWa(r.phone); wa.target = "_blank"; wa.rel = "noopener";
    wa.textContent = " · וואטסאפ";
    phoneWrap.appendChild(wa);
  }
  metaItem(meta, "טלפון", phoneWrap);
  const ownerPill = document.createElement("span");
  ownerPill.className = "pill" + (owner === UNASSIGNED ? " red" : "");
  ownerPill.textContent = owner;
  metaItem(meta, "אחראי", ownerPill);
  metaItem(meta, "עיר", r.city);
  metaItem(meta, "הגעה", fmtDate(r.arrival));
  metaItem(meta, "נוסף ע״י", r.addedBy);
  div.appendChild(meta);

  if (r.notes) { const n = document.createElement("div"); n.className = "notes"; n.textContent = r.notes; div.appendChild(n); }

  const act = document.createElement("div"); act.className = "actions";
  const lab = document.createElement("span"); lab.className = "muted"; lab.textContent = "שינוי אחראי:";
  const sel = document.createElement("select");
  fillSelect(sel, [...OWNERS, UNASSIGNED], owner);
  sel.onchange = () => reassign(r, sel.value);
  const del = document.createElement("button"); del.className = "danger"; del.textContent = "מחק";
  del.onclick = () => remove(r, del);
  act.append(lab, sel, del);
  div.appendChild(act);
  return div;
}

// ---- render ----
function render(){
  const q = $("q").value.trim();
  const f = $("filter").value;
  const grouped = $("group").checked;

  const stats = $("stats"); stats.innerHTML = "";
  const chip = (t, strong) => { const c = document.createElement("span"); c.className = "chip" + (strong ? " strong" : ""); c.textContent = t; stats.appendChild(c); };
  chip(`סה״כ שבושים: ${rows.length}`, true);
  [...OWNERS, UNASSIGNED].forEach(v => {
    const n = rows.filter(r => assigned(r) === v).length;
    if (v === UNASSIGNED && !n) return;
    chip(`${v}: ${n}`);
  });

  const list = rows
    .filter(r => f === "all" || assigned(r) === f)
    .filter(r => !q || `${r.name} ${r.phone} ${r.city || ""}`.includes(q))
    .sort((a, b) => (a.name || "").localeCompare(b.name || "", "he"));

  const out = $("list"); out.innerHTML = "";
  if (!list.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = rows.length ? "אין תוצאות לחיפוש או לסינון" : "אין שבושים להצגה עדיין";
    out.appendChild(e); return;
  }
  if (!grouped) { list.forEach(r => out.appendChild(card(r))); return; }

  [...OWNERS, UNASSIGNED].forEach(v => {
    const items = list.filter(r => assigned(r) === v);
    if (!items.length) return;
    const g = document.createElement("div"); g.className = "group";
    const h = document.createElement("h3");
    const t1 = document.createElement("span"); t1.textContent = v;
    const t2 = document.createElement("span"); t2.className = "muted"; t2.textContent = items.length;
    h.append(t1, t2); g.appendChild(h);
    items.forEach(r => g.appendChild(card(r)));
    out.appendChild(g);
  });
}
$("q").oninput = render;
$("filter").onchange = render;
$("group").onchange = render;

// ---- logo (shared, uploaded by management) ----
function paintLogo(src){
  const box = $("logoBox"); box.innerHTML = "";
  const img = document.createElement("img"); img.alt = "לוגו בעוז הרוח";
  img.src = src || "logo.jpg"; box.appendChild(img);
}
function resizeToDataUrl(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 320, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}
$("logoFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  $("logoMsg").textContent = "מעלה...";
  try {
    const dataUrl = await resizeToDataUrl(file);
    await dbReq("settings/branding", "PUT", { logo: dataUrl });
    paintLogo(dataUrl);
    $("logoMsg").textContent = "הלוגו עודכן ✓";
  } catch (err) { $("logoMsg").textContent = "העלאת הלוגו נכשלה"; }
};

// ---- live data: re-read on every change event ----
async function load(){
  if (!DB_READY) { showErr('עוד לא הוגדר חיבור לנתונים. צריך להוסיף כתובת Firebase.'); render(); return; }
  try {
    const data = await dbReq("shavushim", "GET");
    rows = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : [];
    showErr(""); render();
  } catch (e) { showErr("אין חיבור לנתונים כרגע, מנסים שוב..."); }
}
function listen(){
  if (!DB_READY) return;
  try {
    const es = new EventSource(`${DB}/shavushim.json`);
    es.addEventListener("put", load);
    es.addEventListener("patch", load);
    es.onerror = () => { es.close(); setTimeout(listen, 5000); };
  } catch (e) { setInterval(load, 10000); }
}
async function loadBranding(){
  try { const b = await dbReq("settings/branding", "GET"); paintLogo(b && b.logo); } catch (e) {}
}

render();
load();
loadBranding();
listen();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
